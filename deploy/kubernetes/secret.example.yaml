# Template only -- NOT part of kustomization.yaml's resources, so
# `kubectl apply -k` never applies this file as-is with a placeholder
# password. Create the real Secret imperatively instead (keeps the
# password out of any file that might get committed):
#
#   kubectl create secret generic loom-db-credentials \
#     --namespace loom-catalog \
#     --from-literal=password='<your Postgres password>'
#
# This is copy-paste starting material if you'd rather manage it declaratively
# through your own GitOps/sealed-secrets/external-secrets pipeline -- fill in
# password and apply through that pipeline, never commit the filled-in file.
apiVersion: v1
kind: Secret
metadata:
  name: loom-db-credentials
  namespace: loom-catalog
type: Opaque
stringData:
  password: CHANGEME
