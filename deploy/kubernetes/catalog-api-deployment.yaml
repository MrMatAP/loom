# Stateless -- no local state beyond a per-request DB session and an
# in-memory JWKS cache, both safe to lose on any replica dying. Horizontal
# scaling is purely `replicas` + the HPA below; this does not run multiple
# uvicorn workers per pod (one process per pod is the simpler, more
# Kubernetes-idiomatic unit to scale and to reason about in a rolling
# restart than juggling in-pod multiprocessing).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loom-catalog-api
  namespace: loom-catalog
  labels:
    app.kubernetes.io/name: loom-catalog-api
    app.kubernetes.io/part-of: loom-catalog
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: loom-catalog-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loom-catalog-api
        app.kubernetes.io/part-of: loom-catalog
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: loom-catalog-api
                topologyKey: kubernetes.io/hostname
      containers:
        - name: loom-catalog-api
          image: loom:dev # CHANGEME -- set via `kustomize edit set image`, see kustomization.yaml
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: loom-catalog-config
          env:
            - name: LOOM_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: loom-db-credentials
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # /healthz answers before the lifespan's JWKS fetch completes (it
          # doesn't touch app.state), so this only catches the process
          # being genuinely down or deadlocked, not "IDP unreachable" --
          # that surfaces as 401s on real requests instead, which no probe
          # should treat as an outage.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          emptyDir: {}
