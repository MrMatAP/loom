# Applies pending Alembic migrations (`loom db upgrade`) once, before the
# catalog-api/catalog-mcp Deployments start. Deliberately a single-run Job,
# not a per-pod initContainer: `loom db upgrade` racing across N
# concurrently-starting replicas is exactly the failure this project's
# history already hit once (DuplicateObject on a shared Postgres enum
# type, created twice by two migrations racing against a fresh database).
# One runner, always -- see docs/admin-guide.md for the required apply
# order (this Job must reach Complete before the Deployments are applied;
# `kubectl apply -k` gives no ordering guarantee on its own).
apiVersion: batch/v1
kind: Job
metadata:
  name: loom-db-migrate
  namespace: loom-catalog
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loom-db-migrate
        app.kubernetes.io/part-of: loom-catalog
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loom-db-migrate
          image: loom:dev # CHANGEME -- set via `kustomize edit set image`, see kustomization.yaml
          # `args`, not `command` -- see catalog-mcp-deployment.yaml's
          # comment on the same point.
          args: ['loom', 'db', 'upgrade']
          envFrom:
            - configMapRef:
                name: loom-catalog-config
          env:
            - name: LOOM_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: loom-db-credentials
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          emptyDir: {}
