[build-system]
requires = [
    'setuptools==83.0.0',
    'build==1.5.0',
    'wheel==0.47.0'
]
build-backend = 'setuptools.build_meta'

[project]
name = "loom"
description = "An AI-Enabled Distributed Systems IDE"
urls = { "Sources" = "https://github.com/MrMatAP/loom" }
keywords = ["experimental"]
readme = "README.md"
license = "MIT"
authors = [
    { "name" = "Mathieu Imfeld", "email" = "imfeldma+9jqerw@gmail.com" }
]
maintainers = [
    { "name" = "Mathieu Imfeld", "email" = "imfeldma+9jqerw@gmail.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.14"
]
requires-python = ">=3.14"
dynamic = ["version"]
dependencies = [
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pyjwt[crypto]>=2.9.0",
    "httpx>=0.27.0",
    "greenlet>=3.0.0",
]
[dependency-groups]
dev = [
    "build==1.4.2",
    "pytest==9.1.1",
    "setuptools==82.0.1",
    "wheel==0.46.3",
    "ruff>=0.16.0",
    "pyrefly>=1.1.1",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0",
]

[tool.setuptools.dynamic]
version = { attr = "ci.version" }

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["ci"]

[tool.setuptools.package-data]
"*" = ["*.py", "*.yml", "*.yaml", ".j2", "*.md", "inventory", "*.json", ".helmignore", "*.lock", "*.tpl", "*.txt", "*.tcss", "*.mako"]

[project.scripts]
loom = "loom.cli.main:run"
loom-catalog-api = "loom.api.catalog.main:run"

# If you are debugging your tests using PyCharm then comment out the coverage options
# in addopts
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--cov=loom --cov-branch --cov-report=term --cov-report=xml:build/coverage.xml --junit-xml=build/junit.xml"
testpaths = ["tests"]
junit_family = "xunit2"
log_cli = 1
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format="%Y-%m-%d %H:%M:%S"
asyncio_default_fixture_loop_scope='session'

[tool.ruff]
src = ["src/loom", "tests"]
line-length = 88
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
isort = { known-first-party = ["loom"] }
ignore = ["UP046"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.format]
quote-style = "single"
